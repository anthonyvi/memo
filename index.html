<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memoshi</title>
<style>
:root{--bg:#fdf1f6;--shell:#ff8fb8;--shell2:#ff6fa3;--screen:#cfe8c4;--ink:#2b3a2b;--card:#fff;--text:#2a2230;--muted:#7d7088;--line:#ecdbe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1623;--shell:#c94f83;--shell2:#a93d6b;--screen:#9fc294;--card:#2a2133;--text:#f4eaf7;--muted:#a898b3;--line:#3c3048}}
:root[data-theme="dark"]{--bg:#1d1623;--shell:#c94f83;--shell2:#a93d6b;--screen:#9fc294;--card:#2a2133;--text:#f4eaf7;--muted:#a898b3;--line:#3c3048}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",system-ui,sans-serif;min-height:100vh;padding:16px}
.wrap{max-width:460px;margin:0 auto}
.device{background:linear-gradient(160deg,var(--shell),var(--shell2));border-radius:48% 48% 44% 44%/38% 38% 50% 50%;padding:34px 30px 40px;box-shadow:0 10px 0 rgba(0,0,0,.15),inset 0 -6px 0 rgba(0,0,0,.12);text-align:center}
.brand{font-weight:800;letter-spacing:3px;color:#fff;font-size:13px;margin-bottom:10px}
.screen{background:var(--screen);border:6px solid rgba(0,0,0,.25);border-radius:22px;padding:12px;color:var(--ink);font-family:"Courier New",monospace;min-height:220px;position:relative;image-rendering:pixelated}
.bubble{background:rgba(255,255,255,.55);border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font-size:13px;font-weight:700;min-height:44px;display:flex;align-items:center;justify-content:center}
.pet{width:92px;height:80px;margin:16px auto 6px;background:var(--ink);border-radius:46% 46% 40% 40%;position:relative;cursor:pointer;animation:bob 1.2s steps(2) infinite;transition:background .3s}
.pet::before,.pet::after{content:"";position:absolute;top:28px;width:12px;height:12px;background:var(--screen);border-radius:50%}
.pet::before{left:24px}.pet::after{right:24px}
.mouth{position:absolute;left:50%;bottom:16px;width:22px;height:11px;margin-left:-11px;border:4px solid var(--screen);border-top:0;border-radius:0 0 22px 22px}
.pet.worried .mouth{border-top:4px solid var(--screen);border-bottom:0;border-radius:22px 22px 0 0;height:9px;bottom:14px}
.pet.worried{animation:shake .25s linear infinite}
.pet.sleep{animation:none;opacity:.8}.pet.sleep::before,.pet.sleep::after{height:3px;top:34px;border-radius:2px}
.pet.love{animation:jump .5s ease 2}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes jump{50%{transform:translateY(-22px) scale(1.08)}}
.stats{font-size:12px;font-weight:700;display:flex;justify-content:space-between;margin-top:6px}
.hearts{letter-spacing:2px}
.btns{display:flex;justify-content:center;gap:18px;margin-top:20px}
.btn{width:46px;height:46px;border-radius:50%;border:0;background:#ffe3ee;box-shadow:0 4px 0 rgba(0,0,0,.2);font-size:20px;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
h2{font-size:18px;margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.add{background:var(--shell2);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.list{display:grid;gap:10px}
.block{border-radius:18px;padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;color:#2a2230;border:3px solid rgba(0,0,0,.12);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.block.done{opacity:.5}.block.done .t{text-decoration:line-through}
.ic{font-size:30px;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.55);display:grid;place-items:center;flex:none}
.info{flex:1;min-width:0}.t{font-weight:800;font-size:16px;overflow-wrap:anywhere}.d{font-size:13px;opacity:.8;margin-top:2px}
.acts{display:flex;gap:6px;flex:none}
.acts button{width:34px;height:34px;border-radius:10px;border:0;background:rgba(255,255,255,.6);cursor:pointer;font-size:16px}
.empty{text-align:center;color:var(--muted);padding:24px}
.modal{position:fixed;inset:0;background:rgba(20,10,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:5;padding:12px}
.modal.on{display:flex}
.sheet{background:var(--card);border-radius:24px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
input[type=text],input[type=date],input[type=time]{width:100%;padding:11px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.row{display:flex;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--text)}
.em{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:22px;cursor:pointer}
.em.on{border-color:var(--shell2);background:var(--line)}
.foot{display:flex;gap:10px;margin-top:18px}
.foot button{flex:1;padding:12px;border-radius:14px;border:0;font-weight:800;font-size:15px;cursor:pointer}
.ok{background:var(--shell2);color:#fff}.no{background:var(--line);color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="device">
    <div class="brand">★ MEMOSHI ★</div>
    <div class="screen">
      <div class="bubble" id="say">…</div>
      <div class="pet" id="pet"><div class="mouth"></div></div>
      <div class="stats"><span>Humeur <span class="hearts" id="hearts"></span></span><span id="cnt"></span></div>
    </div>
    <div class="btns">
      <button class="btn" id="bFeed" title="Nourrir">🍙</button>
      <button class="btn" id="bPlay" title="Câlin">💖</button>
      <button class="btn" id="bAdd" title="Nouveau rappel">➕</button>
    </div>
  </div>

  <h2>Mes rappels <button class="add" id="add2">+ Nouveau</button></h2>
  <div class="list" id="list"></div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="mt">Nouveau rappel</h3>
    <label>Titre</label>
    <input type="text" id="fTitle" maxlength="50" placeholder="Ex : Contrôle de maths">
    <div class="row">
      <div style="flex:1"><label>Date</label><input type="date" id="fDate"></div>
      <div style="flex:1"><label>Heure (option)</label><input type="time" id="fTime"></div>
    </div>
    <label>Couleur</label><div class="opts" id="colors"></div>
    <label>Logo</label><div class="opts" id="icons"></div>
    <div class="foot"><button class="no" id="cancel">Annuler</button><button class="ok" id="save">Enregistrer</button></div>
  </div>
</div>

<script>
var COLORS=["#ffb3c7","#ffd59a","#fff09a","#b8f0b0","#a8e0ff","#d4bfff"];
var ICONS=["⚠️","📚","🏀","💃","🎂","🎮","🎵","⚽","🎬","🦷","🧪","⭐"];
var KEY="tamarappel-v1";
var pendDel=null,pendTimer=null,items=[],editId=null,selC=COLORS[0],selI=ICONS[0],mood=3,msgTimer=null;

function iso(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function load(){try{var r=localStorage.getItem(KEY);if(r){items=JSON.parse(r);return}}catch(e){}
  items=[
    {id:1,title:"Attention : contrôle de maths",date:iso(1),time:"",color:COLORS[0],icon:"⚠️",done:false},
    {id:2,title:"Tournoi de basket",date:iso(3),time:"19:00",color:COLORS[1],icon:"🏀",done:false},
    {id:3,title:"Bal de promo",date:iso(4),time:"",color:COLORS[5],icon:"💃",done:false}];}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){};try{fetch("/api/reminders",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(items)})}catch(e){}}
function diff(s){var a=new Date();a.setHours(0,0,0,0);var b=new Date(s+"T00:00:00");return Math.round((b-a)/864e5)}
function when(it){var n=diff(it.date),t=it.time?" à "+it.time.replace(":","h"):"";
  var d=new Date(it.date+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"});
  var r=n===0?"Aujourd’hui":n===1?"Demain":n<0?"Passé":"Dans "+n+" jours";return r+" · "+d+t}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function render(){
  var list=items.slice().sort(function(a,b){return (a.done-b.done)||((a.date+a.time)>(b.date+b.time)?1:-1)});
  var el=document.getElementById("list");
  if(!list.length){el.innerHTML='<div class="empty">Aucun rappel… Ton petit compagnon s’ennuie 😴</div>'}
  else el.innerHTML=list.map(function(it){return '<div class="block'+(it.done?' done':'')+'" style="background:'+it.color+'">'+
    '<div class="ic">'+it.icon+'</div><div class="info"><div class="t">'+esc(it.title)+'</div><div class="d">'+when(it)+'</div></div>'+
    '<div class="acts"><button data-a="done" data-id="'+it.id+'" title="Fait">'+(it.done?'↩️':'✅')+'</button><button data-a="edit" data-id="'+it.id+'" title="Modifier">✏️</button><button data-a="del" data-id="'+it.id+'" title="Supprimer"'+(pendDel===it.id?' style="width:auto;padding:0 10px;background:#e5484d;color:#fff;font-weight:800;font-size:13px"':'')+'>'+(pendDel===it.id?'Sûr ?':'🗑️')+'</button></div></div>'}).join("");
  var todo=items.filter(function(i){return !i.done&&diff(i.date)>=0}).sort(function(a,b){return (a.date+a.time)>(b.date+b.time)?1:-1});
  var pet=document.getElementById("pet"),say=document.getElementById("say");
  document.getElementById("cnt").textContent=todo.length+" à venir";
  pet.className="pet";
  if(!todo.length){pet.classList.add("sleep");say.textContent="Zzz… rien de prévu. Ajoute un rappel !";mood=3}
  else{var n=todo[0],d=diff(n.date);
    if(d<=1){pet.classList.add("worried");mood=1;say.textContent=n.icon+" "+n.title+(d===0?" aujourd’hui !":" demain !")}
    else{mood=d<=3?2:3;say.textContent=n.icon+" Prochain : "+n.title+" ("+d+" j)"}}
  document.getElementById("hearts").textContent="❤️".repeat(mood)+"🤍".repeat(3-mood);
}
function say(t){var s=document.getElementById("say");s.textContent=t;clearTimeout(msgTimer);msgTimer=setTimeout(render,2200)}
function love(t){var p=document.getElementById("pet");p.classList.remove("love");void p.offsetWidth;p.classList.add("love");say(t)}

function openM(it){editId=it?it.id:null;document.getElementById("mt").textContent=it?"Modifier le rappel":"Nouveau rappel";
  document.getElementById("fTitle").value=it?it.title:"";document.getElementById("fDate").value=it?it.date:iso(1);
  document.getElementById("fTime").value=it?it.time:"";selC=it?it.color:COLORS[0];selI=it?it.icon:ICONS[0];pick();
  document.getElementById("modal").classList.add("on")}
function closeM(){document.getElementById("modal").classList.remove("on")}
function pick(){document.getElementById("colors").innerHTML=COLORS.map(function(c){return '<button class="sw'+(c===selC?' on':'')+'" style="background:'+c+'" data-c="'+c+'"></button>'}).join("");
  document.getElementById("icons").innerHTML=ICONS.map(function(i){return '<button class="em'+(i===selI?' on':'')+'" data-i="'+i+'">'+i+'</button>'}).join("")}
document.getElementById("colors").onclick=function(e){var c=e.target.dataset.c;if(c){selC=c;pick()}};
document.getElementById("icons").onclick=function(e){var i=e.target.dataset.i;if(i){selI=i;pick()}};
document.getElementById("save").onclick=function(){
  var t=document.getElementById("fTitle").value.trim(),d=document.getElementById("fDate").value;
  if(!t){document.getElementById("fTitle").focus();return}if(!d)d=iso(0);
  var o={title:t,date:d,time:document.getElementById("fTime").value,color:selC,icon:selI};
  if(editId){items=items.map(function(i){return i.id===editId?Object.assign({},i,o):i})}
  else{o.id=Date.now();o.done=false;items.push(o)}
  persist();closeM();render();love("Noté ! Je veille dessus 🐾")};
document.getElementById("cancel").onclick=closeM;
document.getElementById("modal").onclick=function(e){if(e.target.id==="modal")closeM()};
document.getElementById("bAdd").onclick=function(){openM()};
document.getElementById("add2").onclick=function(){openM()};
document.getElementById("pet").onclick=function(){love("Hihi ! Ça chatouille 💕")};
document.getElementById("bPlay").onclick=function(){love("Câlin ! Je t’aime 💖")};
document.getElementById("bFeed").onclick=function(){love("Miam ! Merci 🍙")};
document.getElementById("list").onclick=function(e){var b=e.target.closest("button");if(!b)return;var id=+b.dataset.id,a=b.dataset.a;
  if(a==="edit"){openM(items.filter(function(i){return i.id===id})[0])}
  else if(a==="del"){if(pendDel===id){clearTimeout(pendTimer);pendDel=null;items=items.filter(function(i){return i.id!==id});persist();render();say("Rappel supprimé 🗑️")}else{pendDel=id;render();clearTimeout(pendTimer);pendTimer=setTimeout(function(){pendDel=null;render()},3000)}}
  else if(a==="done"){items=items.map(function(i){if(i.id===id)i.done=!i.done;return i});persist();render();love("Bravo, une tâche de moins ! 🎉")}};
load();render();fetch("/api/reminders").then(function(r){return r.ok?r.json():null}).then(function(d){if(Array.isArray(d)){items=d;render()}}).catch(function(){});
</script>
</body>
</html>
